name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack
      - name: Test installed package
        run: |
          package_file=$(realpath manifest-*.tgz)
          install_dir=$(mktemp -d)
          cd "$install_dir"
          npm install --ignore-scripts "$package_file"
          node -e "const {manifest,flush}=require('manifest'); if(typeof manifest!=='function'||typeof flush!=='function') process.exit(1)"
          node --input-type=module -e "import {manifest,flush} from 'manifest'; if(typeof manifest!=='function'||typeof flush!=='function') process.exit(1)"
