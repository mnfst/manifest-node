name: Publish

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

concurrency:
  group: publish-manifest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Detect version bump
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          current=$(git show "${AFTER_SHA}:package.json" | jq -r .version)
          if [ "$MANUAL" = "true" ]; then
            echo "version=$current" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: publishing $current"
            exit 0
          fi
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            previous=$(git show "${BEFORE_SHA}:package.json" 2>/dev/null | jq -r .version 2>/dev/null || echo "")
          else
            previous=""
          fi
          if [ -n "$previous" ] && [ "$previous" != "$current" ]; then
            echo "version=$current" >> "$GITHUB_OUTPUT"
            echo "Version bumped: $previous -> $current"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "::notice::No version change; nothing to publish."
          fi

  publish:
    needs: detect
    if: needs.detect.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish
